services:
  - type: web
    name: maidkaro-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: maidkaro-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_JWT_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: maidkaro-redis
          property: connectionString

  - type: worker
    name: maidkaro-celery-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_app worker --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: maidkaro-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: maidkaro-redis
          property: connectionString

databases:
  - name: maidkaro-db
    plan: starter
    databaseName: maidkaro
    user: maidkaro
